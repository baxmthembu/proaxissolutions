<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 76" role="img" aria-label="Proaxis Solutions logo">
  <title>Proaxis Solutions</title>
  <!-- ═══ ICON MARK ═══ -->
  <rect x="4" y="4" width="68" height="68" rx="14" fill="#0F172A"/>
  <rect x="4" y="4" width="68" height="68" rx="14" fill="none" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Y-axis: teal, upward progress -->
  <line x1="38" y1="52" x2="38" y2="22" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 29 L38 22 L44 29" fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- X-axis: white, foundation baseline -->
  <line x1="18" y1="52" x2="58" y2="52" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>
  <path d="M53 46 L58 52 L53 58" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35"/>
  <!-- Origin dot: teal precision point -->
  <circle cx="38" cy="52" r="3" fill="#14B8A6"/>
  <!-- ═══ WORDMARK ═══ -->
  <text x="90" y="36"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#0F172A"
    letter-spacing="0.5">Proaxis</text>
  <text x="91" y="57"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-size="10.5"
    font-weight="400"
    fill="#64748B"
    letter-spacing="4.5">SOLUTIONS</text>
</svg>
