<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proaxis Solutions — Device Mockup Preview</title>
  <link href="https://rsms.me/inter/inter.css" rel="stylesheet">
  <style>
    :root { --navy:#0F172A; --blue:#2563EB; --teal:#14B8A6; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',system-ui,sans-serif; }
    body { background: linear-gradient(135deg, #060B18 0%, #0F1B2D 50%, #060B18 100%); min-height:100vh; color:#fff; }

    /* HEADER */
    header { text-align:center; padding: 60px 2rem 40px; }
    header h1 { font-size:clamp(1.6rem,3vw,2.2rem); font-weight:800; letter-spacing:-0.03em; margin-bottom:0.5rem; }
    header h1 span { color:var(--teal); }
    header p { font-size:0.95rem; font-weight:500; color:#64748B; }

    /* PAGE SWITCHER */
    .switcher { display:flex; justify-content:center; gap:0.5rem; margin-bottom:3rem; flex-wrap:wrap; padding:0 1rem; }
    .sw-btn {
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
      color:#94A3B8; border-radius:8px; padding:0.45rem 1.1rem;
      font-size:0.82rem; font-weight:700; cursor:pointer; transition:all 0.15s;
    }
    .sw-btn:hover { background:rgba(255,255,255,0.12); color:#fff; }
    .sw-btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }

    /* STAGE */
    .stage { display:flex; justify-content:center; align-items:flex-end; gap:3rem; padding:0 2rem 4rem; flex-wrap:wrap; }

    /* DESKTOP MOCKUP */
    .desktop-mockup {
      position:relative;
      filter: drop-shadow(0 40px 80px rgba(0,0,0,0.6));
      flex-shrink:0;
    }
    .desktop-screen {
      width: 900px;
      max-width: calc(100vw - 200px);
      background:#1E293B;
      border-radius:12px 12px 0 0;
      overflow:hidden;
      border:2px solid #334155;
      border-bottom:none;
    }
    .desktop-bar {
      background:#0F172A; padding:0.6rem 0.9rem;
      display:flex; align-items:center; gap:0.6rem;
    }
    .d-dot { width:10px; height:10px; border-radius:50%; }
    .d-urlbar { flex:1; height:22px; background:rgba(255,255,255,0.06); border-radius:5px; display:flex; align-items:center; padding:0 0.7rem; }
    .d-urlbar span { font-size:0.68rem; color:#64748B; font-weight:600; }
    .desktop-iframe { width:100%; height:560px; border:none; display:block; }
    .desktop-base {
      width: calc(100% + 80px);
      margin-left: -40px;
      height: 22px;
      background: linear-gradient(to bottom, #334155, #1E293B);
      border-radius:0 0 6px 6px;
    }
    .desktop-stand {
      width:120px; height:30px;
      background:#1E293B;
      margin:0 auto;
      clip-path:polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
    }
    .desktop-foot {
      width:200px; height:8px;
      background:#334155;
      border-radius:4px;
      margin:0 auto;
    }

    /* MOBILE MOCKUP */
    .mobile-mockup {
      filter: drop-shadow(0 30px 60px rgba(0,0,0,0.5));
      flex-shrink:0;
      align-self:flex-end;
    }
    .phone-outer {
      width:260px;
      background:#1E293B;
      border-radius:36px;
      border:3px solid #334155;
      padding:14px 8px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    .phone-notch {
      width:80px; height:22px;
      background:#0F172A;
      border-radius:0 0 14px 14px;
      margin:0 auto 8px;
    }
    .phone-screen {
      width:100%; height:500px;
      border-radius:20px;
      overflow:hidden;
      background:#fff;
    }
    .phone-iframe { width:390px; height:844px; border:none; transform:scale(0.618); transform-origin:top left; }
    .phone-home-btn {
      width:60px; height:5px; background:#334155;
      border-radius:3px; margin:10px auto 0;
    }

    /* LABELS */
    .device-caption { text-align:center; margin-top:1.25rem; font-size:0.75rem; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:0.07em; }

    /* FOOTER */
    footer { text-align:center; padding:2rem; font-size:0.78rem; font-weight:500; color:#334155; }
    footer a { color:var(--blue); text-decoration:none; font-weight:700; }
    footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>

<header>
  <h1>Proaxis <span>Solutions</span> — Device Preview</h1>
  <p>How your website looks on desktop and mobile — side by side</p>
</header>

<div class="switcher">
  <button class="sw-btn active" onclick="setPage('index.html',this)">🏠 Home</button>
  <button class="sw-btn" onclick="setPage('services.html',this)">⚙️ Services</button>
  <button class="sw-btn" onclick="setPage('about.html',this)">🏢 About</button>
  <button class="sw-btn" onclick="setPage('contact.html',this)">✉️ Contact</button>
</div>

<div class="stage">

  <!-- Desktop -->
  <div>
    <div class="desktop-mockup">
      <div class="desktop-screen">
        <div class="desktop-bar">
          <div class="d-dot" style="background:#EF4444;"></div>
          <div class="d-dot" style="background:#F59E0B;"></div>
          <div class="d-dot" style="background:#22C55E;"></div>
          <div class="d-urlbar"><span id="desktop-url">🔒 proaxissolutions.co.za</span></div>
        </div>
        <iframe class="desktop-iframe" id="desktop-iframe" src="index.html"></iframe>
      </div>
      <div class="desktop-base"></div>
      <div class="desktop-stand"></div>
      <div class="desktop-foot"></div>
    </div>
    <div class="device-caption">🖥 Desktop View</div>
  </div>

  <!-- Mobile -->
  <div>
    <div class="mobile-mockup">
      <div class="phone-outer">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <iframe class="phone-iframe" id="mobile-iframe" src="index.html"></iframe>
        </div>
        <div class="phone-home-btn"></div>
      </div>
    </div>
    <div class="device-caption">📲 Mobile View</div>
  </div>

</div>

<footer>
  <a href="prototype.html">→ Open Full Interactive Prototype</a> &nbsp;·&nbsp;
  <a href="index.html">→ View Live Site</a>
</footer>

<script>
  const urls = { 'index.html':'proaxissolutions.co.za', 'services.html':'proaxissolutions.co.za/services', 'about.html':'proaxissolutions.co.za/about', 'contact.html':'proaxissolutions.co.za/contact' };
  function setPage(page, btn) {
    document.querySelectorAll('.sw-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('desktop-iframe').src = page;
    document.getElementById('mobile-iframe').src = page;
    document.getElementById('desktop-url').textContent = '🔒 ' + (urls[page] || page);
  }
</script>
</body>
</html>
